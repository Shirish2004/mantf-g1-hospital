mantf_nav:
  ros__parameters:
    map_source: auto
    map_yaml: ""
    map_topic: /map
    map_frame: map
    base_frame: pelvis
    pose_source: ground_truth
    ground_truth_topic: /sim/ground_truth
    scan_topic: /scan
    cloud_topic: ""
    use_scan: true
    unknown_is_occupied: true
    robot_radius: 0.32
    safety_margin: 0.06
    dynamic_margin: 0.18
    dynamic_ttl: 2.0
    dynamic_mark_radius: 0.10
    window_radius: 5.0
    local_resolution: 0.05
    global_downsample: 4
    local_goal_lookahead: 3.0
    pursuit_lookahead: 0.8
    goal_tolerance: 0.30
    yaw_tolerance: 0.40
    control_rate: 20.0
    replan_period: 0.30
    global_replan_period: 4.0
    retrain_period: 1.0
    path_timeout: 1.0
    max_v: 0.50
    max_vy: 0.30
    max_w: 0.80
    min_vx: 0.0
    rows: 1200
    train_epochs: 8
    warmup_epochs: 20
    pretrain_epochs: 20
    model_path: ""
    device: auto
    action_name: /navigate_to_pose
    cmd_topic: /g1/cmd_vel_nav
    path_topic: /mantf/path
    status_topic: /mantf/status
    publish_path: true
    save_checkpoint: ""
