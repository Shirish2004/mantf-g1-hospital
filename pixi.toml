[workspace]
name = "mantf-g1-hospital"
channels = ["conda-forge"]
platforms = ["linux-64"]

[activation]
scripts = ["scripts/activate.sh"]

[dependencies]
python = "3.10.*"
pip = "*"
numpy = "<2"
scipy = "*"
matplotlib = "*"
pyyaml = "*"
pillow = "*"
pytest = "*"

[pypi-dependencies]
torch = ">=2.2"
py_trees = ">=2.2"
onnxruntime = ">=1.17"
colcon-common-extensions = "*"
lark = "*"
opencv-python = "<4.11"
tensorboard = "*"
catkin-pkg = "*"
empy = "==3.3.4"
osrf-pycommon = "*"
netifaces = "*"
psutil = "*"
typeguard = "*"
packaging = "*"

[tasks]
stack = "bash scripts/run_stack.sh"
scene = "bash scripts/run_stack.sh scene"
robot = "bash scripts/run_stack.sh robot"
viewer = "python -m mantf_g1_bridge.sensor_viewer"
fleet = "python -m mantf_g1_bridge.fleet_node --ros-args --params-file $MANTF_G1_ROOT/ros2_ws/src/mantf_g1_bridge/config/fleet.yaml -p map_yaml:=$MANTF_G1_MAP"
mission = "python -m mantf_g1_bridge.pick_place_node --ros-args -p config:=$MANTF_G1_ROOT/ros2_ws/src/mantf_g1_bridge/config/pick_place.yaml -p repeat:=false"
people = "python -m mantf_g1_bridge.walkers_node"
ksim = "python -m mantf_g1_bridge.kinematic_sim"
goto = "python -m mantf_g1_bridge.goto"
pickplace = "python -m mantf_g1_bridge.cli pickplace"
status = "python -m mantf_g1_bridge.cli status"
rviz = "bash scripts/rviz.sh"
build = "bash scripts/build_ros_overlay.sh"
test = "python -m pytest -q -p no:launch_testing -p no:launch_ros tests"
offline = "python scripts/fleet_offline.py"
stop = "bash scripts/stop_stack.sh"
case = "bash scripts/run_case.sh"
setup = "bash scripts/install_global_env.sh"
isaac = "env -u PYTHONPATH bash scripts/run_isaac_62.sh"
isaac-smoke = "env -u PYTHONPATH bash scripts/run_isaac_62.sh --smoke"
